  services:
    - type: web
      name: martialcomp
      env: python
      region: oregon
      plan: free
      buildCommand: "./build.sh"
      startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
      envVars:
        - key: DJANGO_SETTINGS_MODULE
          value: config.settings_render
        - key: SECRET_KEY
          generateValue: true
        - key: DEBUG
          value: false
        - key: PYTHON_VERSION
          value: 3.11
        - key: DATABASE_URL
          fromDatabase:
            name: martialcomp-db
            property: connectionString

  databases:
    - name: martialcomp-db
      databaseName: martialcomp
      user: martialcomp