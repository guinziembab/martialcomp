# Override Plesk default behavior
# 18 langues supportées par MartialComp
location ~ ^/(fr|en|es|it|de|pt|ru|vi|no|ja|zh-hans|hi|ar|sw|am|zu|yo|ko)/ {
proxy_pass http://127.0.0.1:8000;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Timeout settings
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Buffer settings
proxy_buffering off;
}

# Routes /org/ pour les sites d'organisations (permet iframe avec SAMEORIGIN)
location ~ ^/org/ {
proxy_pass http://127.0.0.1:8000;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Timeout settings
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Buffer settings
proxy_buffering off;

# Override X-Frame-Options pour permettre apercu dans iframe
proxy_hide_header X-Frame-Options;
add_header X-Frame-Options SAMEORIGIN always;
}

# Page d'accueil racine
location = / {
proxy_pass http://127.0.0.1:8000;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Timeout settings
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Buffer settings
proxy_buffering off;
}

# Admin et autres routes Django
location ~ ^/(admin|api|accounts|set_language|__debug__|health)/ {
proxy_pass http://127.0.0.1:8000;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Timeout settings
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Buffer settings
proxy_buffering off;
}

# Fichiers statiques
location /static/ {
alias /var/www/vhosts/martialcomp.com/httpdocs/static/;
expires 30d;
add_header Cache-Control "public, immutable";
}

# Fichiers media
location /media/ {
alias /var/www/vhosts/martialcomp.com/httpdocs/media/;
expires 7d;
}
