# Configuration Nginx pour MartialComp Production
# Proxy vers Gunicorn sur 127.0.0.1:8888

# Routes /org/ pour les sites d'organisations (permet iframe avec SAMEORIGIN)
location ~ ^/org/ {
    proxy_pass http://127.0.0.1:8888;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Permet l'affichage dans iframe depuis le meme domaine (apercu du site)
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# Configuration multilingue pour Django i18n
location ~ ^/(fr|en|es|it|de|pt|ru|vi|no|ja|zh-hans|hi|ar|sw|am|zu|yo|ko)/ {
    proxy_pass http://127.0.0.1:8888;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Headers de securite
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# Route pour les URLs d'administration et API
location ~ ^/(admin|api|accounts|dashboard|competitions|organizations|grades|shop)/ {
    proxy_pass http://127.0.0.1:8888;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    # Headers de securite
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# Route racine
location = / {
    proxy_pass http://127.0.0.1:8888;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Headers de securite
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# Fichiers statiques
location /static/ {
    alias /var/www/vhosts/martialcomp.com/httpdocs/static/;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, immutable";
}

# Fichiers media
location /media/ {
    alias /var/www/vhosts/martialcomp.com/httpdocs/media/;
    expires 7d;
    add_header X-Content-Type-Options nosniff;
}

# Favicon et robots.txt
location = /favicon.ico {
    alias /var/www/vhosts/martialcomp.com/httpdocs/static/favicon.ico;
    access_log off;
    log_not_found off;
}

location = /robots.txt {
    alias /var/www/vhosts/martialcomp.com/httpdocs/static/robots.txt;
    access_log off;
    log_not_found off;
}
