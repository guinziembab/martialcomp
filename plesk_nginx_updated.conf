# Configuration reverse proxy pour MartialComp
server {
    listen 80;
    server_name martialcomp.com www.martialcomp.com;

    # Redirection HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name martialcomp.com www.martialcomp.com;

    # Logs
    access_log /var/log/nginx/martialcomp_access.log;
    error_log /var/log/nginx/martialcomp_error.log;

    # SSL (géré par Plesk)
    ssl_certificate /opt/psa/var/certificates/scfbbbe4en7iel1ehOouGC;
    ssl_certificate_key /opt/psa/var/certificates/scfbbbe4en7iel1ehOouGC;

    # Configuration SSL moderne
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Headers de sécurité (sauf X-Frame-Options qui est géré par location)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Taille maximale des uploads
    client_max_body_size 50M;

    # Fichiers statiques servis par Nginx
    location /static/ {
        alias /var/www/martialcomp/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        add_header X-Frame-Options DENY always;
        gzip_static on;
    }

    location /media/ {
        alias /var/www/martialcomp/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Frame-Options DENY always;
    }

    # Routes /org/ pour les sites d'organisations (permet iframe avec SAMEORIGIN)
    location ~ ^/org/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Permet l'affichage dans iframe depuis le meme domaine (apercu du site)
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Reverse proxy vers Django (routes par defaut)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # WebSocket support (si nécessaire)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Header de sécurité par défaut
        add_header X-Frame-Options DENY always;
    }

    # Health check
    location /health/ {
        proxy_pass http://127.0.0.1:8000/health/;
        access_log off;
        add_header X-Frame-Options DENY always;
    }

    # Favicon
    location = /favicon.ico {
        alias /var/www/martialcomp/staticfiles/favicon.ico;
        access_log off;
        expires 1y;
    }

    # Robots.txt
    location = /robots.txt {
        alias /var/www/martialcomp/staticfiles/robots.txt;
        access_log off;
        expires 1d;
    }
}
