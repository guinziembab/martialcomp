{% extends "grades/base.html" %}
{% load static %}
{% load i18n %}

{% block page_title %}Test Filtrage des Grades{% endblock %}

{% block main_content %}
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Test du Filtrage des Grades</h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="test-discipline" class="form-label">Discipline</label>
                    <select id="test-discipline" class="form-control">
                        <option value="">-- Sélectionnez une discipline --</option>
                        <option value="1">Karaté</option>
                        <option value="2">Taekwondo</option>
                        <option value="3">Judo</option>
                        <option value="4">Qwan Ki Do</option>
                        <option value="5">Kung Fu</option>
                        <option value="6">Vovinam</option>
                        <option value="7">Aikido</option>
                        <option value="8">Krav Maga</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="test-grade" class="form-label">Grade</label>
                    <select id="test-grade" class="form-control" disabled>
                        <option value="">Sélectionnez d'abord une discipline</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div id="debug-info" class="mt-3"></div>
    </div>
</div>
{% endblock %}

{% block page_js %}
<script src="{% static 'competitions/js/grade_filtering.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const debugInfo = document.getElementById('debug-info');
        
        // Vérifier si la classe GradeFilter est disponible
        if (typeof GradeFilter === 'undefined') {
            debugInfo.innerHTML = '<div class="alert alert-danger">❌ Classe GradeFilter non trouvée</div>';
            return;
        }
        
        debugInfo.innerHTML = '<div class="alert alert-success">✅ Classe GradeFilter chargée</div>';
        
        // Créer une instance de GradeFilter
        try {
            const gradeFilter = new GradeFilter('#test-discipline', '#test-grade');
            debugInfo.innerHTML += '<div class="alert alert-success">✅ Instance GradeFilter créée</div>';
        } catch (error) {
            debugInfo.innerHTML += '<div class="alert alert-danger">❌ Erreur création GradeFilter: ' + error.message + '</div>';
        }
    });
</script>
{% endblock %}
