<!-- permissions_manager/templates/permissions_manager/show_roles.html -->
<div class="user-roles">
    <h4>Rôles de l'utilisateur dans {{ context_name }}</h4>
    {% if roles %}
        <ul class="list-group">
            {% for role in roles %}
            <li class="list-group-item">
                <strong>{{ role.name }}</strong>
                {% if role.description %}
                <p class="text-muted">{{ role.description }}</p>
                {% endif %}
            </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="text-muted">Aucun rôle assigné dans ce contexte.</p>
    {% endif %}
</div>
