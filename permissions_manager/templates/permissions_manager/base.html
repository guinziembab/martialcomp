<!-- permissions_manager/templates/permissions_manager/base.html -->
{% extends "base.html" %}

{% block title %}Gestion des permissions{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Navigation</h5>
                </div>
                <div class="list-group list-group-flush">
                    <a href="{% url 'permissions_manager:role_list' %}" class="list-group-item list-group-item-action{% if request.resolver_match.url_name == 'role_list' %} active{% endif %}">
                        <i class="fas fa-user-tag"></i> Gestion des rôles
                    </a>
                    <a href="{% url 'permissions_manager:user_role_list' %}" class="list-group-item list-group-item-action{% if request.resolver_match.url_name == 'user_role_list' %} active{% endif %}">
                        <i class="fas fa-users-cog"></i> Attributions de rôles
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
            
            {% block permission_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
