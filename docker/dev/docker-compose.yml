version: '3.8'

services:
  db:
    image: postgres:13
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=martialcomp_dev
      - POSTGRES_USER=martialcomp
      - POSTGRES_PASSWORD=devpassword
    ports:
      - "5432:5432"

  redis:
    image: redis:6
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data

  web:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../..:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=1
      - SECRET_KEY=devsecretkey
      - DATABASE_URL=postgres://martialcomp:devpassword@db:5432/martialcomp_dev
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - ALLOWED_HOSTS=localhost,127.0.0.1
    stdin_open: true
    tty: true

volumes:
  postgres_data_dev:
  redis_data_dev: