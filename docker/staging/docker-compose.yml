version: '3.8'

services:
  db:
    image: postgres:13
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=martialcomp_staging
      - POSTGRES_USER=martialcomp
      - POSTGRES_PASSWORD=${DB_PASSWORD:-stagingpassword}
    restart: always

  redis:
    image: redis:6
    volumes:
      - redis_data_staging:/data
    restart: always

  web:
    build:
      context: ../..
      dockerfile: docker/staging/Dockerfile
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ../../logs:/app/logs
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgres://martialcomp:${DB_PASSWORD:-stagingpassword}@db:5432/martialcomp_staging
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.staging
      - ALLOWED_HOSTS=localhost,127.0.0.1,staging.martialcomp.local
    restart: always

  nginx:
    image: nginx:1.21
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_data:/var/www/html/static
      - media_data:/var/www/html/media
    depends_on:
      - web
    restart: always

volumes:
  postgres_data_staging:
  redis_data_staging:
  static_data:
  media_data: