{% load i18n %}

{% if grade_options %}
    {% for category in grade_options %}
        <optgroup label="{{ category.category }}">
            {% for grade in category.grades %}
                <option value="{{ grade.id }}" data-color="{{ grade.color|default:'' }}">
                    {{ grade.name }}
                </option>
            {% endfor %}
        </optgroup>
    {% endfor %}
{% else %}
    <option value="">{% trans "Aucun grade disponible" %}</option>
{% endif %}
