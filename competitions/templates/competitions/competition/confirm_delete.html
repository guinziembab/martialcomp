<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer la compétition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .delete-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .alert {
            border-left: 5px solid #842029;
        }
        @media (max-width: 768px) {
            .action-buttons {
                flex-direction: column;
                gap: 0.5rem;
            }
            .action-buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="delete-container">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="card-title h3 mb-4"><i class="fas fa-exclamation-triangle text-danger me-2"></i> Confirmer la suppression</h1>
                    
                    <div class="alert alert-danger">
                        <h5 class="alert-heading mb-2">Attention !</h5>
                        <p>Êtes-vous sûr de vouloir supprimer la compétition :</p>
                        <p class="fw-bold">"{{ competition.title }}"</p>
                        <hr>
                        <p class="mb-0"><strong>Cette action est irréversible !</strong></p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between mt-4 action-buttons">
                            <a href="{% url 'competitions:competitions:detail' competition.pk %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i> Annuler
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash me-2"></i> Confirmer la suppression
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
