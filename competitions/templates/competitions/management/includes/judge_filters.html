{% comment %}
Filtres pour la liste des juges.
Ce template partiel est inclus dans judges.html.
{% endcomment %}

<div class="card shadow-sm mb-4">
    <div class="card-header bg-light">
        <h5 class="mb-0">
            <i class="fas fa-filter me-2"></i>{% trans "Filtres" %}
        </h5>
    </div>
    <div class="card-body">
        <form id="judgeFilterForm" method="GET" action="">
            <div class="row g-3">
                <!-- Recherche par nom -->
                <div class="col-md-4">
                    <label for="search" class="form-label">{% trans "Recherche" %}</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="search" name="q" 
                               placeholder="{% trans 'Nom, prénom...' %}" value="{{ request.GET.q|default:'' }}">
                        <button class="btn btn-outline-secondary" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Filtre par discipline -->
                <div class="col-md-4">
                    <label for="discipline" class="form-label">{% trans "Discipline" %}</label>
                    <select class="form-select" id="discipline" name="discipline">
                        <option value="">{% trans "Toutes les disciplines" %}</option>
                        {% for discipline in disciplines %}
                            <option value="{{ discipline.id }}" {% if request.GET.discipline == discipline.id|stringformat:"i" %}selected{% endif %}>
                                {{ discipline.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Filtre par niveau de qualification -->
                <div class="col-md-4">
                    <label for="qualification_level" class="form-label">{% trans "Niveau" %}</label>
                    <select class="form-select" id="qualification_level" name="qualification_level">
                        <option value="">{% trans "Tous les niveaux" %}</option>
                        <option value="novice" {% if request.GET.qualification_level == 'novice' %}selected{% endif %}>
                            {% trans "Novice" %}
                        </option>
                        <option value="regional" {% if request.GET.qualification_level == 'regional' %}selected{% endif %}>
                            {% trans "Régional" %}
                        </option>
                        <option value="national" {% if request.GET.qualification_level == 'national' %}selected{% endif %}>
                            {% trans "National" %}
                        </option>
                        <option value="international" {% if request.GET.qualification_level == 'international' %}selected{% endif %}>
                            {% trans "International" %}
                        </option>
                    </select>
                </div>
                
                <!-- Filtre par type de juge -->
                <div class="col-md-4">
                    <label for="judge_type" class="form-label">{% trans "Type de juge" %}</label>
                    <select class="form-select" id="judge_type" name="judge_type">
                        <option value="">{% trans "Tous les types" %}</option>
                        <option value="technical_judge" {% if request.GET.judge_type == 'technical_judge' %}selected{% endif %}>
                            {% trans "Juge Technique" %}
                        </option>
                        <option value="combat_referee" {% if request.GET.judge_type == 'combat_referee' %}selected{% endif %}>
                            {% trans "Arbitre Combat" %}
                        </option>
                        <option value="both" {% if request.GET.judge_type == 'both' %}selected{% endif %}>
                            {% trans "Technique & Combat" %}
                        </option>
                    </select>
                </div>
                
                <!-- Filtre par club -->
                <div class="col-md-4">
                    <label for="club" class="form-label">{% trans "Club" %}</label>
                    <select class="form-select" id="club" name="club">
                        <option value="">{% trans "Tous les clubs" %}</option>
                        {% for club in clubs %}
                            <option value="{{ club.id }}" {% if request.GET.club == club.id|stringformat:"i" %}selected{% endif %}>
                                {{ club.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Filtre par disponibilité -->
                <div class="col-md-4">
                    <label for="available" class="form-label">{% trans "Disponibilité" %}</label>
                    <select class="form-select" id="available" name="available">
                        <option value="">{% trans "Tous les juges" %}</option>
                        <option value="true" {% if request.GET.available == 'true' %}selected{% endif %}>
                            {% trans "Disponibles uniquement" %}
                        </option>
                        <option value="false" {% if request.GET.available == 'false' %}selected{% endif %}>
                            {% trans "Non disponibles uniquement" %}
                        </option>
                    </select>
                </div>
            </div>
            
            <div class="d-flex justify-content-between mt-4">
                <button type="reset" class="btn btn-outline-secondary" id="resetFilters">
                    <i class="fas fa-undo me-2"></i>{% trans "Réinitialiser" %}
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-search me-2"></i>{% trans "Filtrer" %}
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Réinitialiser le formulaire et soumettre
        document.getElementById('resetFilters').addEventListener('click', function(e) {
            e.preventDefault();
            const form = document.getElementById('judgeFilterForm');
            form.reset();
            form.submit();
        });
        
        // Soumission automatique lors du changement de sélection
        const autoSubmitSelects = [
            'discipline', 'qualification_level', 'judge_type', 'club', 'available'
        ];
        
        autoSubmitSelects.forEach(selectId => {
            document.getElementById(selectId).addEventListener('change', function() {
                document.getElementById('judgeFilterForm').submit();
            });
        });
    });
</script>
