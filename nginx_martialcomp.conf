server {
    listen 80;
    server_name martialcomp.com www.martialcomp.com;
    
    # Redirection HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name martialcomp.com www.martialcomp.com;
    
    # Configuration SSL
    ssl_certificate /opt/psa/var/certificates/scf4fmQE7;
    ssl_certificate_key /opt/psa/var/certificates/scf4fmQE7;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Configuration de base
    root /var/www/vhosts/martialcomp.com/httpdocs;
    index index.html;
    
    # Taille maximale des uploads
    client_max_body_size 100M;
    
    # Gestion des fichiers statiques Django
    location /static/ {
        alias /var/www/vhosts/martialcomp.com/httpdocs/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location /media/ {
        alias /var/www/vhosts/martialcomp.com/httpdocs/media/;
        expires 1y;
        add_header Cache-Control "public";
    }
    
    # Transférer toutes les autres requêtes vers Django
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Configuration pour WebSocket si nécessaire
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffers
        proxy_buffers 16 4k;
        proxy_buffer_size 2k;
    }
    
    # Configuration des logs
    access_log /var/log/nginx/martialcomp_access.log;
    error_log /var/log/nginx/martialcomp_error.log;
}