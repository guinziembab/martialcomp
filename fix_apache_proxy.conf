# Configuration additionnelle pour corriger le problème de set_language
# À ajouter dans /var/www/vhosts/system/martialcomp.com/conf/vhost_ssl.conf

# Augmenter les timeouts pour les requêtes POST
ProxyTimeout 30

# Configuration spécifique pour set_language
<Location /set_language/>
    ProxyPass http://127.0.0.1:8888/set_language/ retry=0 timeout=30
    ProxyPassReverse http://127.0.0.1:8888/set_language/
</Location>

# S'assurer que les requêtes POST sont bien transmises
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"